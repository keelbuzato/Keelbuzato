<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#161032"/>
      <stop offset="100%" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#c084fc;#f472b6;#7dd3fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#7dd3fc;#c084fc;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .edge { stroke: #8b5cf6; stroke-width: 1.2; stroke-opacity: 0.35; stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
    .edge.b { stroke: #38bdf8; animation-duration: 4.5s; }
    .node { fill: #c4b5fd; animation: pulse 3s ease-in-out infinite; }
    .node.c { fill: #7dd3fc; }
    .halo { fill: #a78bfa; opacity: 0.25; animation: halo 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: 0.4s; } .d2 { animation-delay: 0.9s; } .d3 { animation-delay: 1.4s; }
    .d4 { animation-delay: 1.9s; } .d5 { animation-delay: 2.4s; }

    .title { font: 700 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#name); }
    .sub { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0; }
    .tag { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0abfc; letter-spacing: 2px; }
    .chip { fill: #1e1b4b; stroke: #7c3aed; stroke-opacity: 0.7; }
    .chiptxt { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ddd6fe; }

    .term { fill: #0d1117; stroke: #3b2a6b; }
    .mono { font: 15px 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .prompt { fill: #f472b6; } .cmd { fill: #e2e8f0; } .out { fill: #7dd3fc; } .ok { fill: #4ade80; }
    .line { opacity: 0; animation: type 14s ease-out infinite; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 2.2s; }
    .l4 { animation-delay: 3s; } .l5 { animation-delay: 3.6s; } .l6 { animation-delay: 4.7s; }
    .l7 { animation-delay: 5.5s; }
    .cursor { fill: #f472b6; animation: blink 1s steps(1) infinite; }
    .intro { opacity: 0; animation: rise 1.2s ease-out forwards; }
    .i2 { animation-delay: 0.3s; } .i3 { animation-delay: 0.6s; } .i4 { animation-delay: 0.9s; }

    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes halo { 0%, 100% { transform: scale(0.6); opacity: 0; } 50% { transform: scale(1.6); opacity: 0.35; } }
    @keyframes type { 0% { opacity: 0; transform: translateX(-8px); } 3% { opacity: 1; transform: translateX(0); } 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <circle cx="900" cy="190" r="260" fill="url(#glow)"/>

  <!-- neural network -->
  <g>
    <line class="edge" x1="40" y1="60" x2="170" y2="30"/>
    <line class="edge b" x1="170" y1="30" x2="300" y2="44"/>
    <line class="edge" x1="300" y1="44" x2="520" y2="30"/>
    <line class="edge b" x1="520" y1="30" x2="640" y2="80"/>
    <line class="edge" x1="640" y1="80" x2="610" y2="330"/>
    <line class="edge b" x1="610" y1="330" x2="420" y2="356"/>
    <line class="edge" x1="420" y1="356" x2="220" y2="358"/>
    <line class="edge b" x1="220" y1="358" x2="30" y2="330"/>
    <line class="edge" x1="30" y1="330" x2="26" y2="200"/>
    <line class="edge b" x1="26" y1="200" x2="40" y2="60"/>
    <line class="edge b" x1="1140" y1="40" x2="1170" y2="200"/>
    <line class="edge" x1="1170" y1="200" x2="1120" y2="350"/>
  </g>
  <g>
    <circle class="halo" cx="170" cy="30" r="14"/>
    <circle class="halo d2" cx="610" cy="330" r="14"/>
    <circle class="halo d4" cx="520" cy="30" r="14"/>
    <circle class="halo d3" cx="1170" cy="200" r="14"/>
    <circle class="halo d1" cx="26" cy="200" r="14"/>
    <circle class="node" cx="40" cy="60" r="3.5"/>
    <circle class="node c d1" cx="170" cy="30" r="5"/>
    <circle class="node d2" cx="300" cy="44" r="4"/>
    <circle class="node c d3" cx="26" cy="200" r="4.5"/>
    <circle class="node d4" cx="220" cy="358" r="3.5"/>
    <circle class="node c d5" cx="420" cy="356" r="4"/>
    <circle class="node d1" cx="520" cy="30" r="4.5"/>
    <circle class="node c d2" cx="640" cy="80" r="3.5"/>
    <circle class="node d3" cx="610" cy="330" r="5"/>
    <circle class="node c d4" cx="30" cy="330" r="3.5"/>
    <circle class="node c d4" cx="1140" cy="40" r="3.5"/>
    <circle class="node d5" cx="1170" cy="200" r="4.5"/>
    <circle class="node c d1" cx="1120" cy="350" r="3.5"/>
  </g>

  <!-- left: identity -->
  <g transform="translate(70 0)">
    <text class="tag intro" x="0" y="118">HI THERE, I'M</text>
    <text class="title intro i2" x="-3" y="182">Raquel Buzato</text>
    <text class="sub intro i3" x="0" y="222">Full Stack Developer · Frontend-focused</text>
    <g class="intro i4">
      <rect class="chip" x="0" y="250" width="92" height="30" rx="15"/>
      <text class="chiptxt" x="46" y="270" text-anchor="middle">React</text>
      <rect class="chip" x="102" y="250" width="100" height="30" rx="15"/>
      <text class="chiptxt" x="152" y="270" text-anchor="middle">Next.js</text>
      <rect class="chip" x="212" y="250" width="118" height="30" rx="15"/>
      <text class="chiptxt" x="271" y="270" text-anchor="middle">TypeScript</text>
      <rect class="chip" x="340" y="250" width="96" height="30" rx="15"/>
      <text class="chiptxt" x="388" y="270" text-anchor="middle">Node.js</text>
      <rect class="chip" x="0" y="290" width="230" height="30" rx="15"/>
      <circle cx="22" cy="305" r="4" fill="#f472b6"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text class="chiptxt" x="122" y="310" text-anchor="middle">AI-Assisted Development</text>
    </g>
  </g>

  <!-- right: terminal -->
  <g transform="translate(690 70)">
    <rect class="term" width="440" height="240" rx="12"/>
    <rect width="440" height="34" rx="12" fill="#161b26"/>
    <rect y="22" width="440" height="12" fill="#161b26"/>
    <circle cx="20" cy="17" r="6" fill="#f87171"/>
    <circle cx="40" cy="17" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="17" r="6" fill="#4ade80"/>
    <text class="mono" x="220" y="22" text-anchor="middle" fill="#64748b" font-size="13">raquel@dev ~ zsh</text>

    <g class="mono">
      <text class="line l1" x="20" y="68"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
      <text class="line l2" x="20" y="94"><tspan class="out">full stack developer · frontend-focused</tspan></text>
      <text class="line l3" x="20" y="126"><tspan class="prompt">$ </tspan><tspan class="cmd">cat stack.txt</tspan></text>
      <text class="line l4" x="20" y="152"><tspan class="out">react · next.js · typescript</tspan></text>
      <text class="line l5" x="20" y="176"><tspan class="out">node.js · nestjs · graphql · gcp</tspan></text>
      <text class="line l6" x="20" y="208"><tspan class="prompt">$ </tspan><tspan class="cmd">status --remote</tspan></text>
      <text class="line l7" x="20" y="232"><tspan class="ok">✓ open to remote roles worldwide</tspan></text>
    </g>
    <rect class="cursor" x="290" y="219" width="9" height="17"/>
  </g>
</svg>
